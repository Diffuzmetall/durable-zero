idth="250" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="1026" y="170">Native Harness</text><text class="note" x="1026" y="194">реальный agent runtime</text></g><g><rect x="1010" y="350" width="250" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="1026" y="380">Models + SQLite</text><text class="note" x="1026" y="404">генерация / persistence</text></g><g><rect x="675" y="350" width="250" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="691" y="380">control.jsonl</text><text class="note" x="691" y="404">filesystem channel</text><text class="note" x="691" y="424">в цели: session/abortTask</text></g><g><rect x="330" y="350" width="260" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="346" y="380">Legacy host-rpc</text><text class="note" x="346" y="404">старые mutable forwarders</text><text class="note" x="346" y="424">в цели заменяется HostBridge</text></g><text class="title" x="30" y="552">До Slice 0: новый runner существует, но исполнительный путь разорван</text><g><rect x="20" y="600" width="225" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="36" y="630">runner/main.ts</text><text class="note" x="36" y="654">отдельный entrypoint</text></g><g><rect x="330" y="600" width="260" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="346" y="630">composition</text><text class="note" x="346" y="654">создаёт зависимости</text><text class="note" x="346" y="674">и SessionCoordinator</text></g><g><rect x="675" y="600" width="250" height="100" rx="3" fill="#282824" stroke="#be9288"/><text class="node" x="691" y="630">SessionCoordinator</text><text class="note" x="691" y="654">prompt не вызывает engine</text></g><g><rect x="1010" y="600" width="250" height="100" rx="3" fill="#282824" stroke="#be9288"/><text class="node" x="1026" y="630">accepted: rec_...</text><text class="note" x="1026" y="654">квитанция, не генерация</text>