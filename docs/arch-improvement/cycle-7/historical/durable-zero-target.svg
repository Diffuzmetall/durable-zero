<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 930" role="img" aria-label="durable-zero · целевая архитектура"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#858477"/></marker></defs><rect width="1300" height="930" fill="#1e1e1b"/><style>text{font-family:Arial, sans-serif}.title{font-size:25px;font-weight:600;fill:#ece8df}.sub{font-size:15px;fill:#b3aea2}.node{font-size:18px;font-weight:600;fill:#ece8df}.note{font-size:14px;fill:#b3aea2}.edge{fill:none;stroke:#858477;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:13px;fill:#b3aea2}</style><text class="title" x="30" y="34">durable-zero · целевая архитектура</text><text class="sub" x="30" y="62">Вся схема ниже — цель Cycle 7. Подсвеченные компоненты сейчас реализуются, а не уже приняты.</text><path class="edge" d="M245 270 H310" marker-start="url(#arrow)"/><text class="label" x="277" y="258" text-anchor="middle">stdio</text><path class="edge" d="M535 270 H600"/><text class="label" x="567" y="258" text-anchor="middle">dispatch</text><path class="edge" d="M825 270 H890"/><text class="label" x="858" y="258" text-anchor="middle">порт</text><path class="edge" d="M1050 320 V420" marker-start="url(#arrow)"/><text class="label" x="1160" y="374" text-anchor="middle">native calls / events</text><path class="edge" d="M890 470 H825" marker-start="url(#arrow)"/><path class="edge" d="M600 470 H535"/><text class="label" x="568" y="456" text-anchor="middle">tool call</text><path class="edge" d="M422 420 V320"/><text class="label" x="352" y="374" text-anchor="middle">reverse RPC</text><path class="edge" d="M712 520 V650"/><text class="label" x="755" y="590" text-anchor="middle">local tools</text><path class="edge" d="M422 650 V600 H650 V520"/><text class="label" x="525" y="590" text-anchor="middle">resources</text><path class="edge" d="M980 520 V650" marker-start="url(#arrow)"/><text class="label" x="1020" y="590" text-anchor="middle">persistence</text><path class="edge" d="M1120 520 V650" marker-start="url(#arrow)"/><text class="label" x="1185" y="590" text-anchor="middle">inference</text><path class="edge" d="M1050 220 V175 H422 V220"/><text class="label" x="812" y="163" text-anchor="middle">canonical events / terminal settlement</text><path class="edge" d="M710 180 V220" stroke-dasharray="5 5"/><path class="edge" d="M780 130 H1045 V220" stroke-dasharray="5 5"/><g><rect x="20" y="220" width="225" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="36" y="250">Клиент / Host</text><text class="note" x="36" y="274">BB · терминал · UI</text><text class="note" x="36" y="294">отвечает на reverse RPC</text></g><g><rect x="310" y="220" width="225" height="100" rx="3" fill="#282824" stroke="#c2a775"/><text class="node" x="326" y="250">protocol</text><text class="note" x="326" y="274">JSON-RPC 2.0 · stdio</text><text class="note" x="326" y="294">wire ID и pending requests</text><text x="523" y="308" text-anchor="end" font-size="12" fill="#c2a775">Task 4A · в работе</text></g><g><rect x="600" y="220" width="225" height="100" rx="3" fill="#282824" stroke="#c2a775"/><text class="node" x="616" y="250">core</text><text class="note" x="616" y="274">SessionCoordinator</text><text class="note" x="616" y="294">lifecycle + чистые порты</text><text x="813" y="308" text-anchor="end" font-size="12" fill="#c2a775">Slice 0 · в работе</text></g><g><rect x="890" y="220" width="320" height="100" rx="3" fill="#282824" stroke="#c2a775"/><text class="node" x="906" y="250">PiDurableEngine</text><text class="note" x="906" y="274">adapter-pi-durable</text><text class="note" x="906" y="294">openDurable · controller · watchers</text><text x="1198" y="308" text-anchor="end" font-size="12" fill="#c2a775">Slice 0 · в работе</text></g><g><rect x="890" y="420" width="320" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="906" y="450">Native Pi Harness</text><text class="note" x="906" y="474">conversations · submissions · tasks</text><text class="note" x="906" y="494">зрелый runtime сохраняем</text></g><g><rect x="600" y="420" width="225" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="616" y="450">Registry / tools</text><text class="note" x="616" y="474">Codemode · Pi Resources</text><text class="note" x="616" y="494">host tool adapters</text></g><g><rect x="310" y="420" width="225" height="100" rx="3" fill="#282824" stroke="#c2a775"/><text class="node" x="326" y="450">HostBridge</text><text class="note" x="326" y="474">валидация payload</text><text class="note" x="326" y="494">timeout → server.request</text><text x="523" y="508" text-anchor="end" font-size="12" fill="#c2a775">Task 2A · в работе</text></g><g><rect x="310" y="650" width="225" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="326" y="680">Ресурсы</text><text class="note" x="326" y="704">skills · settings · prompt</text><text class="note" x="326" y="724">загрузчики вне core</text></g><g><rect x="600" y="650" width="225" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="616" y="680">Execution env</text><text class="note" x="616" y="704">FS · процессы · sandbox</text><text class="note" x="616" y="724">конкретные реализации</text></g><g><rect x="890" y="650" width="155" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="906" y="680">SQLite + lock</text><text class="note" x="906" y="704">native persistence</text><text class="note" x="906" y="724">один lifecycle</text></g><g><rect x="1080" y="650" width="175" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="1096" y="680">Models / LLM</text><text class="note" x="1096" y="704">native provider</text><text class="note" x="1096" y="724">внешний LLM</text></g><g><rect x="570" y="80" width="280" height="100" rx="3" fill="#282824" stroke="#686a60"/><text class="node" x="586" y="110">CLI + Composition Root</text><text class="note" x="586" y="134">единственная сборка адаптеров</text></g><text class="sub" x="30" y="810">Сплошные стрелки: runtime-вызовы и данные. Пунктир: сборка и injection.</text><text class="sub" x="30" y="842">HostBridge пока не подключён к Harness. Интеграция и полный host-tool E2E идут позже.</text><text class="sub" x="30" y="874">Accepted = native admission ID. Результат = streaming + реальное settlement + сохранённый transcript.</text></svg>